<!doctype html><html><body style="margin:0"><iframe id="f" src="" style="width:1280px;height:900px;border:0"></iframe><pre id="out"></pre>
<script>var f=document.getElementById('f'),logs=[];f.src=location.hash.slice(1)||'/en/';
f.addEventListener('load',function(){try{var cw=f.contentWindow;['error','warn'].forEach(function(k){var o=cw.console[k];cw.console[k]=function(){logs.push(k.toUpperCase()+' '+Array.prototype.join.call(arguments,' ').slice(0,260));o.apply(cw.console,arguments)}});cw.addEventListener('error',function(e){logs.push('WINERR '+e.message)})}catch(e){logs.push('hook fail '+e)}});
setTimeout(function(){try{var d=f.contentDocument;var t=d.body.innerText;var cyr=t.split('\n').filter(function(l){return /[А-Яа-яЁё]/.test(l)});
var o=['title: '+d.title,'lang: '+d.documentElement.lang,'hydrated: '+(function(){var h=d.querySelector('header');for(var k in h){if(k.indexOf('__reactFiber')===0)return true}return false})(),'links to /en: '+d.querySelectorAll('a[href^="/en/"]').length+' | links to root pages: '+Array.prototype.filter.call(d.querySelectorAll('a[href^="/"]'),function(a){return !/^\/(en\/|assets|_next|#)/.test(a.getAttribute('href'))&&a.getAttribute('href')!=='/en/'}).map(function(a){return a.getAttribute('href')}).slice(0,8).join(','),'cur-btn: '+d.querySelectorAll('.nv-cur-btn').length,'LOGS: '+logs.length,logs.join('\n'),'CYRILLIC visible lines: '+cyr.length,cyr.slice(0,25).join('\n')];
document.getElementById('out').textContent=o.join('\n')}catch(e){document.getElementById('out').textContent='fail '+e}},14000)</script></body></html>
